<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杉山参 SugiyamaMairu 點歌系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #2d0a0a 0%, #1a0505 100%); 
            color: #fce7e7; 
            font-family: "Microsoft JhengHei", sans-serif;
            min-height: 100vh;
            margin: 0;
        }
        .search-container { 
            background-color: rgba(74, 13, 13, 0.4); 
            border: 1px solid #5e1111; 
            backdrop-filter: blur(10px); 
        }
        .table-header { 
            background-color: #721c1c; 
            color: #ffffff; 
            border-bottom: 2px solid #a32a2a; 
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .list-item { 
            background-color: rgba(94, 17, 17, 0.15); 
            border-bottom: 1px solid #3d0c0c; 
        }
        .list-item:hover { background-color: rgba(163, 42, 42, 0.3); }
        
        /* 統一字體與強制單行 */
        .column-text {
            font-size: 1.05rem; 
            padding: 1rem 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-red-100 tracking-widest mb-2">杉山参 SugiyamaMairu</h1>
            <p class="text-red-400/60 text-xs md:text-sm mb-2">專屬點歌庫系統</p>
            <div class="h-1 w-16 bg-red-600 mx-auto rounded-full"></div>
        </header>

        <div class="search-container p-3 mb-6 rounded-xl shadow-lg">
            <input type="text" id="searchInput" placeholder="🔍 快速搜尋歌手、歌名..." 
                class="bg-transparent w-full p-2 outline-none text-red-100 text-lg placeholder:text-red-900/40">
        </div>

        <div class="table-header grid grid-cols-12 px-4 py-3 rounded-t-lg font-bold text-sm md:text-base">
            <div class="col-span-3">歌手</div>
            <div class="col-span-4">歌名</div>
            <div class="col-span-3 text-center">語言</div>
            <div class="col-span-2 text-right">類別</div>
        </div>

        <div id="songList" class="flex flex-col rounded-b-lg overflow-hidden bg-black/20 shadow-2xl min-h-[400px]">
            <div id="loadingStatus" class="text-center py-24 text-red-900 animate-pulse text-lg">正在讀取歌庫...</div>
        </div>
    </div>

    <script>
        const sheetId = '1h402uFU7BIfq1X4ntEvF2utUymAvGsTUiWlaV4afqaA';
        // 使用更快速的 JSONP 請求方式
        const fullUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
        let allSongs = [];

        async function fetchSongs() {
            const container = document.getElementById('songList');
            try {
                // 優化：優先從快取獲取，減少等待感
                const response = await fetch(fullUrl);
                if (!response.ok) throw new Error();
                
                const text = await response.text();
                const jsonString = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/)[1];
                const data = JSON.parse(jsonString);
                
                // 快速處理資料
                allSongs = data.table.rows.map(row => ({
                    artist: row.c[0]?.v || "-",
                    song: row.c[1]?.v || "-",
                    lang: row.c[2]?.v || "-",
                    cate: row.c[3]?.v || ""
                }));

                if (allSongs.length > 0) allSongs.shift(); // 移除標題
                renderSongs(allSongs);
            } catch (e) {
                container.innerHTML = `<div class="py-20 text-center text-red-500 font-bold">讀取失敗，請確認網路連線或重新整理。</div>`;
            }
        }

        function renderSongs(songs) {
            const container = document.getElementById('songList');
            if (songs.length === 0) {
                container.innerHTML = `<div class="py-20 text-center text-red-900 italic">無匹配歌曲</div>`;
                return;
            }

            // 使用 DocumentFragment 加速渲染
            const fragment = document.createDocumentFragment();
            songs.forEach(item => {
                const row = document.createElement('div');
                row.className = "list-item grid grid-cols-12 px-4 items-center";
                row.innerHTML = `
                    <div class="col-span-3 column-text text-white font-medium">${item.artist}</div>
                    <div class="col-span-4 column-text text-red-100/90">${
