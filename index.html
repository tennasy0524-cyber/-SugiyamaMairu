<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杉山参 SugiyamaMairu 點歌系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #2d0a0a 0%, #1a0505 100%); 
            color: #fce7e7; 
            font-family: "Microsoft JhengHei", sans-serif;
            min-height: 100vh;
        }
        .search-container { 
            background-color: rgba(74, 13, 13, 0.4); 
            border: 1px solid #5e1111; 
            backdrop-filter: blur(10px); 
        }
        .table-header { 
            background-color: #721c1c; 
            color: #ffffff; 
            border-bottom: 2px solid #a32a2a; 
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .list-item { 
            background-color: rgba(94, 17, 17, 0.15); 
            border-bottom: 1px solid #3d0c0c; 
            transition: 0.2s;
        }
        .list-item:hover { background-color: rgba(163, 42, 42, 0.3); }
        
        /* 統一字體與對齊樣式 */
        .col-cell {
            font-size: 1.05rem; 
            padding: 0.85rem 0.5rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-red-100 tracking-widest mb-2">杉山参 SugiyamaMairu</h1>
            <div class="h-1 w-16 bg-red-600 mx-auto rounded-full"></div>
        </header>

        <div class="search-container p-3 mb-6 rounded-xl shadow-lg">
            <input type="text" id="searchInput" placeholder="🔍 搜尋歌手、歌名..." 
                class="bg-transparent w-full p-2 outline-none text-red-100 text-lg placeholder:text-red-900/40">
        </div>

        <div class="table-header grid grid-cols-12 px-4 py-3 rounded-t-lg font-bold text-sm md:text-base">
            <div class="col-span-3">歌手</div>
            <div class="col-span-4">歌名</div>
            <div class="col-span-3 text-center block">語言</div>
            <div class="col-span-2 text-right block">類別</div>
        </div>

        <div id="songList" class="flex flex-col rounded-b-lg overflow-hidden bg-black/20 shadow-2xl min-h-[400px]">
            <div id="loadingStatus" class="text-center py-24 text-red-900 animate-pulse text-lg">正在嘗試連線歌庫...</div>
        </div>
    </div>

    <script>
        const sheetId = '1h402uFU7BIfq1X4ntEvF2utUymAvGsTUiWlaV4afqaA';
        const fullUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
        let allSongs = [];

        async function fetchSongs() {
            const container = document.getElementById('songList');
            try {
                // 使用 fetch 抓取並處理 Google 試算表 JSON 格式
                const response = await fetch(fullUrl);
                if (!response.ok) throw new Error("連線失敗");
                
                const text = await response.text();
                const jsonString = text.substring(text.indexOf("(") + 1, text.lastIndexOf(")"));
                const data = JSON.parse(jsonString);
                
                allSongs = data.table.rows.map(row => ({
                    artist: row.c[0]?.v || "-",
                    song: row.c[1]?.v || "-",
                    lang: row.c[2]?.v || "-",
                    cate: row.c[3]?.v || ""
                }));

                if (allSongs.length > 0) allSongs.shift(); // 移除首列標題
                renderSongs(allSongs);
            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="py-20 text-center text-red-500 font-bold px-4">
                    <p class="text-xl mb-2">⚠️ 讀取失敗</p>
                    <p class="text-sm">請重新整理頁面，或檢查試算表權限。</p>
                </div>`;
            }
        }

        function renderSongs(songs) {
            const container = document.getElementById('songList');
            if (songs.length === 0) {
                container.innerHTML = `<div class="py-20 text-center text-red-900 italic font-bold">找不到相符的歌曲</div>`;
                return;
            }

            const fragment = document.createDocumentFragment();
            songs.forEach(item => {
                const row = document.createElement('div');
                row.className = "list-item grid grid-cols-12 px-4 items-center";
                row.innerHTML = `
                    <div class="col-span-3 col-cell text-white font-bold">${item.artist}</div>
                    <div class="col-span-4 col-cell text-red-100/90">${item.song}</div>
                    <div class="col-span-3 col-cell justify-center text-red-200/80">${item.lang}</div>
                    <div class="col-span-2 col-cell justify-end text-red-900/50 italic text-sm">${item.cate}</div>
                `;
                fragment.appendChild(row);
            });
            container.innerHTML = '';
            container.appendChild(fragment);
        }

        // 搜尋功能
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const kw = e.target.value.toLowerCase().trim();
            const filtered = allSongs.filter(s => 
                s.artist.toLowerCase().includes(kw) || s.song.toLowerCase().includes(kw)
            );
            renderSongs(filtered);
        });

        fetchSongs();
    </script>
</body>
</html>
