<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杉山参 SugiyamaMairu 點歌系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #2d0a0a 0%, #1a0505 100%); 
            color: #fce7e7; 
            font-family: "Microsoft JhengHei", sans-serif;
            min-height: 100vh;
        }
        .search-container { 
            background-color: rgba(74, 13, 13, 0.4); 
            border: 1px solid #5e1111; 
            backdrop-filter: blur(10px); 
        }
        .table-header { 
            background-color: #721c1c; 
            color: #ffffff; 
            border-bottom: 2px solid #a32a2a; 
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .list-item { 
            background-color: rgba(94, 17, 17, 0.15); 
            border-bottom: 1px solid #3d0c0c; 
        }
        .list-item:hover { background-color: rgba(163, 42, 42, 0.2); }
        
        /* 統一字體大小與對齊 */
        .column-text {
            font-size: 1.05rem; 
            padding: 0.75rem 0.5rem;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #721c1c; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-red-100 tracking-widest mb-2">杉山参 SugiyamaMairu</h1>
            <p class="text-red-400/60 text-sm mb-4">專屬點歌庫系統</p>
            <div class="h-1 w-20 bg-red-600 mx-auto rounded-full"></div>
        </header>

        <div class="relative mb-6 search-container p-4 rounded-xl shadow-lg">
            <input type="text" id="searchInput" placeholder="🔍 快速搜尋..." 
                class="bg-transparent w-full p-2 rounded-lg outline-none text-red-100 text-lg placeholder:text-red-900/50">
        </div>

        <div class="table-header grid grid-cols-12 px-4 py-3 rounded-t-lg text-sm md:text-base font-bold">
            <div class="col-span-3">歌手</div>
            <div class="col-span-4">歌名</div>
            <div class="col-span-3 text-center">語言</div>
            <div class="col-span-2 text-right">類別</div>
        </div>

        <div id="songList" class="flex flex-col rounded-b-lg overflow-hidden shadow-2xl bg-black/20 min-h-[400px]">
            <div id="loadingStatus" class="text-center py-20 text-red-900 animate-pulse text-lg">讀取中...</div>
        </div>
    </div>

    <script>
        let allSongs = [];
        const sheetId = '1h402uFU7BIfq1X4ntEvF2utUymAvGsTUiWlaV4afqaA';
        const fullUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

        // 快速渲染函式
        function renderSongs(songs) {
            const container = document.getElementById('songList');
            if (songs.length === 0) {
                container.innerHTML = `<div class="py-20 text-center text-red-900 italic">無匹配歌曲</div>`;
                return;
            }

            // 使用 DocumentFragment 提升渲染效能
            const fragment = document.createDocumentFragment();
            songs.forEach(item => {
                const row = document.createElement('div');
                row.className = "list-item grid grid-cols-12 px-4 items-center";
                row.innerHTML = `
                    <div class="col-span-3 column-text text-white font-medium">${item.artist}</div>
                    <div class="col-span-4 column-text text-red-100">${item.song}</div>
                    <div class="col-span-3 column-text text-center text-red-300/80">${item.lang}</div>
                    <div class="col-span-2 column-text text-right text-red-500/50 italic text-sm">${item.cate}</div>
                `;
                fragment.appendChild(row);
            });
            container.innerHTML = '';
            container.appendChild(fragment);
        }

        async function fetchSongs() {
            try {
                // 優化：加入緩存控制，並使用更輕量的請求方式
                const response = await fetch(fullUrl);
                const text = await response.text();
                const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/)[1]);
                
                allSongs = json.table.rows.map(row => ({
                    artist: row.c[0]?.v || "-",
                    song: row.c[1]?.v || "-",
                    lang: row.c[2]?.v || "-",
                    cate: row.c[3]?.v || ""
                }));

                allSongs.shift(); // 移除首列標題
                renderSongs(allSongs);
            } catch (e) {
                document.getElementById('songList').innerHTML = `<div class="py-20 text-center text-red-500">讀取失敗，請重整頁面。</div>`;
            }
        }

        // 搜尋防抖處理，提升大量資料時的輸入流暢度
        let timeout = null;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                const kw = e.target.value.toLowerCase().trim();
                const filtered = allSongs.filter(s => 
                    s.song.toLowerCase().includes(kw) || s.artist.toLowerCase().includes(kw) || s.lang.toLowerCase().includes(kw)
                );
                renderSongs(filtered);
            }, 150);
        });

        fetchSongs();
    </script>
</body>
</html>
